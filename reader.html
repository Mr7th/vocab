<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>学术工具 · 论文阅读器</title>
<link rel="stylesheet" href="shared/theme.css?v=1773955514">
<link rel="stylesheet" href="shared/reader.css?v=1773955514">
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="nav-tabs" id="navTabs"></div>
  <h1>📄 论文阅读器</h1>
  <div class="search-area">
    <span class="search-icon">🔍</span>
    <input class="search-box" id="searchInput" placeholder="搜索标题、作者、关键词、#分类标签..." oninput="renderPaperList()">
  </div>
  <div class="stats">
    <div class="stat-badge"><span id="statPapers">0</span>篇</div>
    <div class="stat-badge"><span id="statNotes">0</span>笔记</div>
  </div>
  <div class="actions">
    <button class="btn" onclick="openAddPaperModal()">+ 上传PDF</button>
    <button class="btn" onclick="downloadAllPdfs()" title="批量下载所有 PDF 到本地">📥 下载全部PDF</button>
    <div class="sep"></div>
    <div id="syncButtonsArea" style="display:flex;gap:4px;align-items:center;"></div>
  </div>
</div>

<!-- Main Layout -->
<div class="container">
  <div class="sidebar" id="paperSidebar">
    <div id="folderTree"></div>
    <div id="sortFilterBar"></div>
    <div class="sidebar-divider"></div>
    <div id="paperList"></div>
    <div class="sidebar-add" onclick="openAddPaperModal()">+ 上传新论文</div>
  </div>
  <div class="content" id="mainContent"></div>
</div>

<!-- Upload PDF Modal -->
<div class="modal-overlay" id="addPaperModal">
  <div class="modal" style="width:460px;">
    <h3>📄 上传论文 PDF</h3>
    <div class="pdf-upload-zone" id="pdfUploadZone" onclick="document.getElementById('apPdfFile').click()" style="padding:40px 20px;margin-bottom:12px">
      <div style="font-size:36px;margin-bottom:8px">📎</div>
      <div style="font-size:14px;font-weight:600">点击选择 PDF 文件</div>
      <div style="font-size:11px;margin-top:4px;color:#64748b">或拖拽文件到此处，支持多选</div>
    </div>
    <input type="file" id="apPdfFile" accept=".pdf" style="display:none" onchange="handlePdfSelect(this)" multiple>
    <div class="err" id="apError"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal('addPaperModal')">取消</button></div>
  </div>
</div>

<!-- Edit Paper Modal -->
<div class="modal-overlay" id="editPaperModal">
  <div class="modal" style="width:500px;">
    <h3>✏️ 编辑论文信息</h3>
    <div class="field"><label>标题 *</label><input id="epTitle"></div>
    <div class="field"><label>作者</label><input id="epAuthors"></div>
    <div class="field"><label>年份</label><input id="epYear" type="number"></div>
    <div class="field"><label>期刊/会议</label><input id="epJournal"></div>
    <div class="field"><label>DOI / URL</label><input id="epDoi"></div>
    <div class="field"><label>关键词 (逗号分隔)</label><input id="epTags"></div>
    <div class="field"><label>文件夹</label><select id="epFolder"></select></div>
    <div class="err" id="epError"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('editPaperModal')">取消</button>
      <button class="btn primary" onclick="submitEditPaper()">保存</button>
    </div>
  </div>
</div>

<!-- Add Section Modal -->
<div class="modal-overlay" id="addSectionModal">
  <div class="modal">
    <h3>📑 添加内容板块</h3>
    <div class="field"><label>板块标题 *</label><input id="asTitle" placeholder="e.g. Methods, Key Findings"></div>
    <div class="field"><label>图标</label><input id="asIcon" placeholder="emoji" maxlength="4" style="width:60px"></div>
    <div class="field"><label>内容</label><textarea id="asContent" placeholder="板块内容..." style="min-height:100px"></textarea></div>
    <div class="err" id="asError"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('addSectionModal')">取消</button>
      <button class="btn primary" onclick="submitAddSection()">添加</button>
    </div>
  </div>
</div>

<!-- Sync Modal -->
<div class="modal-overlay" id="syncModal">
  <div class="modal" style="width:520px;">
    <h3>☁️ 云同步设置</h3>
    <div id="syncModalBody"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal('syncModal')">关闭</button></div>
  </div>
</div>

<!-- Add Word Modal -->
<div class="modal-overlay" id="addWordModal">
  <div class="modal">
    <h3>📚 添加到词库</h3>
    <div class="field"><label>英文单词/短语 *</label><input id="awWord"></div>
    <div class="field"><label>中文释义 *</label><input id="awMeaning"></div>
    <div class="field"><label>例句/语境</label><input id="awContext"></div>
    <div class="field"><label>词库分类</label><select id="awCategory"></select></div>
    <div class="err" id="awError"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('addWordModal')">取消</button>
      <button class="btn green" onclick="submitAddWord()">📚 添加</button>
    </div>
  </div>
</div>

<!-- Add Reference Modal -->
<div class="modal-overlay" id="addRefModal">
  <div class="modal">
    <h3 id="addRefModalTitle">添加引用文章</h3>
    <div class="field"><label>文章标题 *</label><input id="arTitle" placeholder="Paper title..."></div>
    <div class="field"><label>作者</label><input id="arAuthors" placeholder="Authors (optional)"></div>
    <div class="field"><label>年份</label><input id="arYear" type="number" placeholder="2024"></div>
    <div class="field"><label>链接 (URL)</label><input id="arUrl" placeholder="https://... (留空自动生成Scholar链接)"></div>
    <div class="err" id="arError"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('addRefModal')">取消</button>
      <button class="btn green" onclick="submitAddRef()">✅ 添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ==================== IndexedDB ====================
function openPdfDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(PDF_DB_NAME, PDF_DB_VER);
    r.onupgradeneeded = e => e.target.result.createObjectStore("pdfs");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function savePdfBlob(id, blob) { const db = await openPdfDB(); return new Promise((res,rej) => { const tx = db.transaction("pdfs","readwrite"); tx.objectStore("pdfs").put(blob,id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function loadPdfBlob(id) { const db = await openPdfDB(); return new Promise((res,rej) => { const tx = db.transaction("pdfs","readonly"); const r = tx.objectStore("pdfs").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }
async function deletePdfBlob(id) { try { const db = await openPdfDB(); db.transaction("pdfs","readwrite").objectStore("pdfs").delete(id); } catch(e){} }

// ==================== PDF Cloud Sync (Gist) ====================
// Upload PDF as base64 to Gist so all devices can access it
var PDF_MAX_SIZE = 25 * 1024 * 1024; // 25MB max

// ── PDF 云同步 v2 ─────────────────────────────────────
// 架构：每个 PDF 存为独立的 PUBLIC Gist（解决私有 Gist raw_url 的 CORS 问题）
// paper.pdfGistId 记录该 PDF 的 Gist ID
// 下载时通过 public raw_url 直接获取（无需认证，CORS 无障碍）

function _blobToBase64(blob) {
  return new Promise(function(resolve) {
    var ab = blob.arrayBuffer ? blob.arrayBuffer() : new Response(blob).arrayBuffer();
    ab.then(function(buf) {
      var bytes = new Uint8Array(buf);
      var binary = "";
      var chunkSize = 8192;
      for (var i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      resolve(btoa(binary));
    });
  });
}

function _base64ToBlob(b64) {
  var binary = atob(b64);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: "application/pdf" });
}

async function uploadPdfToGist(paperId, blob) {
  if (!isGHConnected()) return;
  if (blob.size > PDF_MAX_SIZE) {
    showToast("⚠ PDF 太大 (" + (blob.size/1024/1024).toFixed(1) + "MB)，超过 25MB 限制", 5000);
    return;
  }
  try {
    var b64 = await _blobToBase64(blob);
    console.log("[pdf-sync] Uploading PDF for " + paperId + " (" + (b64.length / 1024 / 1024).toFixed(1) + " MB b64)");

    var paper = PAPERS.find(function(p) { return p.id === paperId; });

    // 如果已有 pdfGistId，更新现有 Gist
    if (paper && paper.pdfGistId) {
      await ghAPI("https://api.github.com/gists/" + paper.pdfGistId, {
        method: "PATCH",
        body: JSON.stringify({ files: { "pdf.b64": { content: b64 } } })
      });
      console.log("[pdf-sync] ✅ Updated existing PDF gist: " + paper.pdfGistId);
    } else {
      // 创建新的 PUBLIC Gist（public=true 解决 raw_url CORS 问题）
      var gist = await ghAPI("https://api.github.com/gists", {
        method: "POST",
        body: JSON.stringify({
          description: "FSI PDF: " + paperId,
          public: true,
          files: { "pdf.b64": { content: b64 } }
        })
      });
      // 保存 Gist ID 到论文元数据
      if (paper) {
        paper.pdfGistId = gist.id;
        paper.updatedAt = Date.now();
        savePapers(PAPERS);
      }
      console.log("[pdf-sync] ✅ Created PDF gist: " + gist.id);
    }

    // 清理旧方案（主 Gist 里的 fsi_pdf_xxx.b64 文件）
    _cleanupOldPdfFile(paperId);

    showToast("☁️ PDF 已同步到云端");
  } catch(e) {
    console.warn("[pdf-sync] Upload failed:", e);
    showToast("⚠ PDF 云端同步失败: " + e.message, 4000);
  }
}

// 清理旧方案遗留的 PDF 文件（不影响功能，静默清理）
async function _cleanupOldPdfFile(paperId) {
  try {
    var gistId = getGHGistId();
    var fileName = "fsi_pdf_" + paperId + ".b64";
    var gist = await ghAPI("https://api.github.com/gists/" + gistId);
    if (gist.files[fileName]) {
      var files = {};
      files[fileName] = null;
      await ghAPI("https://api.github.com/gists/" + gistId, {
        method: "PATCH",
        body: JSON.stringify({ files: files })
      });
      console.log("[pdf-sync] Cleaned up old file: " + fileName);
    }
  } catch(e) { /* ignore cleanup errors */ }
}

async function downloadPdfFromGist(paperId) {
  if (!isGHConnected()) return null;
  var paper = PAPERS.find(function(p) { return p.id === paperId; });

  // ── 新方案：独立 Gist ──
  if (paper && paper.pdfGistId) {
    try {
      console.log("[pdf-sync] Fetching PDF gist: " + paper.pdfGistId);
      var gist = await ghAPI("https://api.github.com/gists/" + paper.pdfGistId);
      var file = gist.files["pdf.b64"];
      if (!file) { console.warn("[pdf-sync] pdf.b64 not found in gist"); return null; }

      var b64;
      if (file.truncated) {
        // 文件 >1MB（大多数 PDF），用 raw_url（public gist 无需认证）
        console.log("[pdf-sync] File truncated, fetching raw_url...");
        var resp = await fetch(file.raw_url, { cache: "no-store" });
        if (!resp.ok) { console.warn("[pdf-sync] raw_url HTTP " + resp.status); return null; }
        b64 = await resp.text();
      } else {
        // 文件 <1MB，API 直接返回了内容
        b64 = file.content;
      }

      console.log("[pdf-sync] Downloaded " + (b64.length / 1024 / 1024).toFixed(1) + " MB b64");
      var blob = _base64ToBlob(b64);
      await savePdfBlob(paperId, blob);
      console.log("[pdf-sync] ✅ Cached locally: " + paperId);
      return blob;
    } catch(e) {
      console.warn("[pdf-sync] Download from PDF gist failed:", e);
      return null;
    }
  }

  // ── 旧方案兼容：主 Gist 里的 fsi_pdf_xxx.b64 ──
  try {
    var gistId = getGHGistId();
    var fileName = "fsi_pdf_" + paperId + ".b64";
    var mainGist = await ghAPI("https://api.github.com/gists/" + gistId);
    var oldFile = mainGist.files[fileName];
    if (!oldFile) return null;

    console.log("[pdf-sync] Found old-style PDF, migrating...");
    var b64Old;
    if (oldFile.truncated) {
      // 旧方案的 raw_url 可能因 CORS 失败，但还是试试
      var resp2 = await fetch(oldFile.raw_url, { cache: "no-store" });
      if (!resp2.ok) {
        console.warn("[pdf-sync] Old raw_url failed (CORS?), HTTP " + resp2.status);
        return null;
      }
      b64Old = await resp2.text();
    } else {
      b64Old = oldFile.content;
    }

    var blobOld = _base64ToBlob(b64Old);
    await savePdfBlob(paperId, blobOld);
    // 自动迁移到新方案
    uploadPdfToGist(paperId, blobOld);
    return blobOld;
  } catch(e) {
    console.warn("[pdf-sync] Old-style download failed:", e);
    return null;
  }
}

async function deletePdfFromGist(paperId) {
  if (!isGHConnected()) return;
  var paper = PAPERS.find(function(p) { return p.id === paperId; });

  // 删除独立 PDF Gist
  if (paper && paper.pdfGistId) {
    try {
      await ghAPI("https://api.github.com/gists/" + paper.pdfGistId, { method: "DELETE" });
      console.log("[pdf-sync] Deleted PDF gist: " + paper.pdfGistId);
    } catch(e) { console.warn("[pdf-sync] Delete PDF gist failed:", e); }
  }

  // 清理旧方案文件
  _cleanupOldPdfFile(paperId);
}

// ==================== MERGE ====================
function mergePapers(local, remote) {
  if (!remote || !Array.isArray(remote)) return local;
  const merged = JSON.parse(JSON.stringify(local));
  remote.forEach(rp => {
    const lp = merged.find(p => p.id === rp.id);
    if (lp) {
      // Ensure arrays exist before merging
      if (!lp.notes) lp.notes = [];
      if (!lp.sections) lp.sections = [];
      if (!lp.references) lp.references = [];
      if (!lp.citations) lp.citations = [];
      // Merge notes (additive by id)
      (rp.notes||[]).forEach(rn => { if (!lp.notes.some(ln => ln.id === rn.id)) lp.notes.push(rn); });
      lp.notes.sort((a,b) => (a.ts||0) - (b.ts||0));
      // Merge sections (additive by title+content hash to avoid false dedup)
      (rp.sections||[]).forEach(rs => {
        if (!lp.sections.some(ls => ls.title === rs.title && ls.content === rs.content)) lp.sections.push(rs);
      });
      // Merge references and citations (additive by doi/title)
      (rp.references||[]).forEach(rr => {
        var key = rr.doi || rr.title || "";
        if (key && !lp.references.some(lr => (lr.doi || lr.title || "") === key)) lp.references.push(rr);
      });
      (rp.citations||[]).forEach(rc => {
        var key = rc.doi || rc.title || "";
        if (key && !lp.citations.some(lc => (lc.doi || lc.title || "") === key)) lp.citations.push(rc);
      });
      // Tags & categoryTags: merge independently of timestamp (take union)
      if (rp.tags && rp.tags.length) {
        if (!lp.tags) lp.tags = [];
        rp.tags.forEach(t => { if (!lp.tags.includes(t)) lp.tags.push(t); });
      }
      if (rp.categoryTags && rp.categoryTags.length) {
        if (!lp.categoryTags) lp.categoryTags = [];
        rp.categoryTags.forEach(t => { if (!lp.categoryTags.includes(t)) lp.categoryTags.push(t); });
      }
      // readingLevel & readingReason: take non-null, prefer newer
      var rTime = rp.updatedAt||0, lTime = lp.updatedAt||0;
      if (!lp.readingLevel && rp.readingLevel) lp.readingLevel = rp.readingLevel;
      if (!lp.readingReason && rp.readingReason) lp.readingReason = rp.readingReason;
      // If remote is newer, overwrite scalar fields
      if (rTime > lTime) {
        console.log("[merge] 📥 远端更新: " + rp.id + " (remote:" + new Date(rTime).toLocaleString() + " > local:" + new Date(lTime).toLocaleString() + ")");
        // All editable scalar fields — use rp[k] !== undefined to allow empty string overwrites
        ["title","summary","authors","journal","doi","year","folderId","pdfGistId","readingLevel","readingReason","abstractEn","abstractZh"].forEach(k => {
          if (rp[k] !== undefined) lp[k] = rp[k];
        });
        // pdfUrl: only sync if local doesn't have a user-uploaded blob
        if (rp.pdfUrl !== undefined && !lp.hasPdf) lp.pdfUrl = rp.pdfUrl;
        // hasPdf: only set to true, never false (blob may exist on other device)
        if (rp.hasPdf) lp.hasPdf = true;
        // Carry over the newer timestamp
        lp.updatedAt = rp.updatedAt;
      }
    } else {
      // 只添加本地不存在且未被删除的远端论文
      merged.push(JSON.parse(JSON.stringify(rp)));
    }
  });
  return merged;
}

// ==================== EXPORT / BACKUP ====================
async function downloadPdf(paperId) {
  var p = PAPERS.find(x => x.id === paperId);
  if (!p) return;
  if (!p.hasPdf && !p.pdfUrl) { showToast("⚠️ 该论文没有 PDF"); return; }
  try {
    showToast("📥 正在准备下载...");
    var blob = await loadPdfBlob(paperId);
    if (!blob) { showToast("⚠️ 未找到 PDF 数据"); return; }
    var safeName = (p.authors ? p.authors.split(",")[0].trim().split(" ").pop() : "paper") +
      (p.year ? "_" + p.year : "") + "_" +
      (p.title || "untitled").replace(/[^a-zA-Z0-9\u4e00-\u9fff]+/g, "_").slice(0, 60) + ".pdf";
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = safeName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("✅ 已下载: " + safeName);
  } catch(e) { showToast("❌ 下载失败: " + e.message); }
}

async function downloadAllPdfs() {
  var pdfPapers = PAPERS.filter(p => p.hasPdf || p.pdfUrl);
  if (!pdfPapers.length) { showToast("⚠️ 没有可下载的 PDF"); return; }
  showToast("📥 开始批量下载 " + pdfPapers.length + " 篇 PDF...");
  var ok = 0, fail = 0;
  for (var p of pdfPapers) {
    try {
      var blob = await loadPdfBlob(p.id);
      if (!blob) { fail++; continue; }
      var safeName = (p.authors ? p.authors.split(",")[0].trim().split(" ").pop() : "paper") +
        (p.year ? "_" + p.year : "") + "_" +
        (p.title || "untitled").replace(/[^a-zA-Z0-9\u4e00-\u9fff]+/g, "_").slice(0, 60) + ".pdf";
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = safeName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      ok++;
      await new Promise(r => setTimeout(r, 500)); // 间隔避免浏览器拦截
    } catch(e) { fail++; console.warn("Download fail:", p.id, e); }
  }
  showToast("✅ 下载完成: " + ok + " 篇成功" + (fail ? ", " + fail + " 篇失败" : ""));
}

// ==================== SYNC ====================
registerSyncApp({
  id: "papers", gistFile: PAPERS_GIST_FILE, syncTsKey: "fsi_papers_last_sync_ts",
  createGistDescription: "FSI Paper Reader Sync",
  getLocalData: () => {
    // Include close-reading cache in sync data
    let crCache = {};
    try { crCache = JSON.parse(localStorage.getItem("fsi_cr_cache") || "{}"); } catch(e) {}
    return { papers: PAPERS, folders: FolderManager.getFolders(), closeReading: crCache, deletedIds: getDeletedIds() };
  },
  applyRemoteData: (remote) => {
    // 合并删除列表：本地 + 远端取并集
    if (remote.deletedIds && Array.isArray(remote.deletedIds)) {
      var localDel = getDeletedIds();
      var merged = [...new Set([...localDel, ...remote.deletedIds])];
      saveDeletedIds(merged);
    }
    var allDeletedIds = new Set(getDeletedIds());
    if (remote.papers) {
      // 合并前过滤掉已删除的论文
      var remotePapers = remote.papers.filter(function(p) { return !allDeletedIds.has(p.id); });
      PAPERS = mergePapers(PAPERS, remotePapers);
      // 本地也过滤掉已删除的
      PAPERS = PAPERS.filter(function(p) { return !allDeletedIds.has(p.id); });
    }
    if (remote.folders) FolderManager.loadFolders(FolderManager.mergeFolders(FolderManager.getFolders(), remote.folders));
    // Merge close-reading cache: keep local entries, add remote ones that are missing or newer
    if (remote.closeReading) {
      let localCR = {};
      try { localCR = JSON.parse(localStorage.getItem("fsi_cr_cache") || "{}"); } catch(e) {}
      for (const paperId in remote.closeReading) {
        if (!localCR[paperId] || localCR[paperId].length < remote.closeReading[paperId].length) {
          localCR[paperId] = remote.closeReading[paperId];
        }
      }
      try { localStorage.setItem("fsi_cr_cache", JSON.stringify(localCR)); } catch(e) {}
    }
    savePapers(PAPERS); window._PAPERS_REF = PAPERS;
  },
  onSyncComplete: () => {
    FolderManager.renderFolderTree(PAPERS);
    renderPaperList(); updateStats();
    if (currentPaperId) {
      const p = PAPERS.find(x => x.id === currentPaperId);
      if (p) {
        // Update paper header (tags, readingLevel, reason, abstract) without destroying PDF viewer
        const headerEl = document.querySelector(".paper-header");
        if (headerEl) {
          // Re-render the full detail view to pick up synced changes
          renderPaperDetail(currentPaperId);
        }
        NotesPanel.loadNotes(p.id, p.notes || [], {title: p.title, authors: p.authors, year: p.year});
        PdfViewer.renderHighlights((p.notes||[]).filter(n => n.highlightRects).map(n => ({
          pageNum: n.pageNum, rects: n.highlightRects, color: n.color || "rgba(251,191,36,0.3)"
        })));
        if (window.CloseReading) { CloseReading.loadPaper(currentPaperId); CloseReading.renderPanel(); }
      }
    }
  }
});

function cycleReadingLevel(paperId) {

  var levels = [null, "skim", "careful", "deep"];
  var idx = levels.indexOf(p.readingLevel || null);
  p.readingLevel = levels[(idx + 1) % levels.length];
  p.updatedAt = Date.now(); savePapers(PAPERS); window._PAPERS_REF = PAPERS;

// --- Inline text editing (reason, summary) ---
function inlineEdit(paperId, field, el) {
  if (el.querySelector("textarea, input")) return; // already editing
  var p = PAPERS.find(x => x.id === paperId); if (!p) return;
  var oldVal = p[field] || "";
  var isMultiline = (field === "summary" || field === "abstractEn" || field === "abstractZh");
  var tag = isMultiline ? "textarea" : "input";
  var inputEl = document.createElement(tag);
  inputEl.className = "inline-edit-input";
  inputEl.value = oldVal;
  if (isMultiline) { inputEl.style.minHeight = "120px"; inputEl.style.resize = "vertical"; inputEl.style.lineHeight = "1.6"; }
  el.textContent = "";
  el.appendChild(inputEl);
  inputEl.focus();

  function save() {
    var newVal = inputEl.value.trim();
    _savePaperField(paperId, field, newVal || null);
    renderPaperDetail(paperId);
  }
  inputEl.addEventListener("blur", save);
  inputEl.addEventListener("keydown", function(e) {
    if (e.key === "Escape") { renderPaperDetail(paperId); }
    if (e.key === "Enter" && !isMultiline) { e.preventDefault(); save(); }
    if (e.key === "Enter" && e.ctrlKey && isMultiline) { e.preventDefault(); save(); }
  });
}

var _currentSort = "manual"; // manual|year|author|journal|level|title
var _currentFilterTags = []; // array of selected tags (AND/intersection logic)
var _currentFilterLevel = null; // null|skim|careful|deep

function _getReadingLevelBadge(level) {
  if (level === "deep") return '<span class="rl-badge rl-deep">精读</span>';
  if (level === "careful") return '<span class="rl-badge rl-careful">细读</span>';
  if (level === "skim") return '<span class="rl-badge rl-skim">粗读</span>';
  return '';
}

function _sortPapers(papers, sortBy) {
  if (sortBy === "manual") return papers;
  var sorted = papers.slice();
  switch(sortBy) {
    case "year": sorted.sort((a,b) => (b.year||0) - (a.year||0)); break;
    case "author": sorted.sort((a,b) => (a.authors||"").localeCompare(b.authors||"")); break;
    case "journal": sorted.sort((a,b) => (a.journal||"").localeCompare(b.journal||"")); break;
    case "title": sorted.sort((a,b) => (a.title||"").localeCompare(b.title||"")); break;
    case "level":
      var order = {deep:0, careful:1, skim:2};
      sorted.sort((a,b) => (order[a.readingLevel]??3) - (order[b.readingLevel]??3));
      break;
  }
  return sorted;
}

function _getAllCategoryTags() {
  var tags = {};
  PAPERS.forEach(p => (p.categoryTags||[]).forEach(t => { tags[t] = (tags[t]||0) + 1; }));
  return Object.entries(tags).sort((a,b) => b[1] - a[1]);
}

function renderPaperList() {
  const list = document.getElementById("paperList");
  const query = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  const folderId = FolderManager.getActiveFolder();
  let filtered = FolderManager.filterPapers(PAPERS, folderId);
  if (query) filtered = filtered.filter(p =>
    (p.title||"").toLowerCase().includes(query) || (p.authors||"").toLowerCase().includes(query) ||
    (p.tags||[]).some(t => t.toLowerCase().includes(query)) || (p.journal||"").toLowerCase().includes(query) ||
    (p.categoryTags||[]).some(t => t.toLowerCase().includes(query))
  );
  // Filter by category tags (AND/intersection: paper must have ALL selected tags)
  if (_currentFilterTags.length) filtered = filtered.filter(p => _currentFilterTags.every(t => (p.categoryTags||[]).includes(t)));
  // Filter by reading level
  if (_currentFilterLevel) filtered = filtered.filter(p => p.readingLevel === _currentFilterLevel);
  // Sort
  filtered = _sortPapers(filtered, _currentSort);

  if (!filtered.length) { list.innerHTML = '<div style="padding:20px 14px;text-align:center;color:#475569;font-size:13px">'+(query||_currentFilterTags.length||_currentFilterLevel?'🔍 无匹配':'暂无论文')+'</div>'; return; }
  list.innerHTML = filtered.map(p => {
    const active = p.id === currentPaperId;
    const catTags = (p.categoryTags||[]).slice(0,2).map(t => '<span class="cat-tag">#'+esc(t)+'</span>').join("");
    const rlBadge = _getReadingLevelBadge(p.readingLevel);
    return '<div class="paper-item'+(active?' active':'')+'" draggable="true" data-paper-id="'+p.id+'" onclick="selectPaper(\''+p.id+'\')">' +
      '<div class="paper-title">'+esc(p.title)+'</div>' +
      '<div class="paper-meta">'+esc(p.authors||"")+(p.year?' · '+p.year:'')+(p.journal?' · '+esc(p.journal):'')+'</div>' +
      '<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">'+catTags+rlBadge+
      ((p.pdfUrl||p.hasPdf)?'<span class="pdf-badge">📎PDF</span>':'') +
      ((p.notes||[]).length?'<span class="note-count">📝'+(p.notes||[]).length+'</span>':'') +
      '</div></div>';
  }).join("");
  setupPaperDrag();
}

function _toggleFilterTag(tag) {
  var idx = _currentFilterTags.indexOf(tag);
  if (idx >= 0) _currentFilterTags.splice(idx, 1);
  else _currentFilterTags.push(tag);
  renderPaperList(); renderSortFilterBar();
}
function _clearFilterTags() {
  _currentFilterTags = [];
  renderPaperList(); renderSortFilterBar();
}

function renderSortFilterBar() {
  var el = document.getElementById("sortFilterBar");
  if (!el) return;
  var html = '';
  // Tag chips (primary filter)
  var allTags = _getAllCategoryTags();
  if (allTags.length) {
    html += '<div class="sf-tags">';
    allTags.forEach(([tag, count]) => {
      var isActive = _currentFilterTags.includes(tag);
      html += '<span class="sf-tag-chip'+(isActive?' active':'')+'" onclick="_toggleFilterTag(\''+esc(tag).replace(/'/g,"\\'")+'\')">#'+esc(tag)+' <small>'+count+'</small></span>';
    });
    if (_currentFilterTags.length) {
      html += '<span class="sf-tag-clear" onclick="_clearFilterTags()">✕ 清除</span>';
    }
    html += '</div>';
  }
  // Sort + Level in one row
  html += '<div class="sf-controls">';
  html += '<select onchange="_currentSort=this.value;renderPaperList()">';
  [["manual","排序: 手动"],["year","排序: 年份↓"],["author","排序: 作者"],["journal","排序: 期刊"],["title","排序: 标题"],["level","排序: 阅读等级"]].forEach(([v,l]) => {
    html += '<option value="'+v+'"'+(_currentSort===v?' selected':'')+'>'+l+'</option>';
  });
  html += '</select>';
  html += '<select onchange="_currentFilterLevel=this.value||null;renderPaperList()">';
  html += '<option value="">等级: 全部</option>';
  [["deep","精读"],["careful","细读"],["skim","粗读"]].forEach(([v,l]) => {
    html += '<option value="'+v+'"'+(_currentFilterLevel===v?' selected':'')+'>'+l+'</option>';
  });
  html += '</select>';
  html += '</div>';
  el.innerHTML = html;
}

function setupPaperDrag() {
  let dragSrcId = null;
  document.querySelectorAll(".paper-item[draggable]").forEach(item => {
    item.addEventListener("dragstart", function(e) {
      dragSrcId = this.dataset.paperId;
      this.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragSrcId);
    });
    item.addEventListener("dragend", function() {
      this.classList.remove("dragging");
      document.querySelectorAll(".paper-item.drag-over").forEach(el => el.classList.remove("drag-over"));
    });
    item.addEventListener("dragover", function(e) {
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      this.classList.add("drag-over");
    });
    item.addEventListener("dragleave", function() { this.classList.remove("drag-over"); });
    item.addEventListener("drop", function(e) {
      e.preventDefault(); this.classList.remove("drag-over");
      const targetId = this.dataset.paperId;
      if (!dragSrcId || !targetId || dragSrcId === targetId) return;
      const srcIdx = PAPERS.findIndex(p => p.id === dragSrcId);
      const tgtIdx = PAPERS.findIndex(p => p.id === targetId);
      if (srcIdx < 0 || tgtIdx < 0) return;
      const moved = PAPERS.splice(srcIdx, 1)[0];
      PAPERS.splice(tgtIdx, 0, moved);
      savePapers(PAPERS); window._PAPERS_REF = PAPERS;
      renderPaperList();
      debouncedPush("论文排序");
    });
  });
}

async function loadPaperPdf(paper) {
  try {
    // Always clear previous PDF before loading a new one
    PdfViewer.destroy();

    // hasPdf (IndexedDB blob) takes priority over pdfUrl —
    // user-uploaded blobs are more reliable than URL references
    var loaded = false;
    if (paper.hasPdf) {
      var blob = await loadPdfBlob(paper.id);
      if (!blob) {
        // Local blob missing — try downloading from Gist
        _showPdfLoading(paper);
        blob = await downloadPdfFromGist(paper.id);
      }
      if (blob) {
        await PdfViewer.loadFromBlob(blob);
        loaded = true;
      } else if (paper.pdfUrl) {
        await PdfViewer.loadFromURL(paper.pdfUrl);
        loaded = true;
      } else {
        _showPdfMissing(paper);
      }
    } else if (paper.pdfUrl) {
      await PdfViewer.loadFromURL(paper.pdfUrl);
      loaded = true;
    }

    if (!loaded) return;

    // Render existing highlights
    const hls = (paper.notes||[]).filter(n => n.highlightRects).map(n => ({
      pageNum: n.pageNum, rects: n.highlightRects, color: n.color || "rgba(251,191,36,0.3)"
    }));
    if (hls.length) PdfViewer.renderHighlights(hls);
  } catch(e) { console.warn("PDF load failed:", e); }
}

  var pagesEl = document.getElementById("pdfPages");

  pagesEl.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#94a3b8;text-align:center;padding:40px">' +

async function handleViewerPdf(file) {
  // Capture paper ID at call time to prevent race condition if user switches papers
  var paperId = currentPaperId;
  if (!file || !paperId) return;
  try {
    const blob = new Blob([await file.arrayBuffer()], {type:"application/pdf"});
    await savePdfBlob(paperId, blob);
    const p = PAPERS.find(x=>x.id===paperId);
    if (p) { p.hasPdf=true; p.updatedAt=Date.now(); savePapers(PAPERS); }
    renderPaperDetail(paperId);
    showToast("📎 PDF 已关联，正在同步到云端...");
    // Upload PDF to Gist FIRST, then push metadata — so other devices
    // won't see hasPdf=true before the PDF file actually exists in Gist
    await uploadPdfToGist(paperId, blob);
    debouncedPush("关联PDF");
  } catch(e) { showToast("❌ "+e.message); }
}

function openAddPaperModal() {

  z.ondragover = e => { e.preventDefault(); z.style.borderColor="#38bdf8"; };

function handlePdfSelect(input) { const files=[...input.files].filter(f=>f.type==="application/pdf"); if(files.length) addPapersFromFiles(files); }
async function addPapersFromFiles(files) {
  const z = document.getElementById("pdfUploadZone");
  z.innerHTML = '⏳ 导入 '+files.length+' 个文件...'; z.classList.add("has-file");
  for (const f of files) {
    const id=uid(), title=f.name.replace(/\.pdf$/i,"").replace(/[_-]/g," ").trim();
    const paper = { id, title, authors:"", year:null, journal:"", doi:"", tags:[], summary:"", sections:[], notes:[], hasPdf:true, addedAt:Date.now(), updatedAt:Date.now() };
    try {
      var blob = new Blob([await f.arrayBuffer()],{type:"application/pdf"});
      await savePdfBlob(id, blob);
      // Upload PDF to Gist FIRST before syncing metadata
      await uploadPdfToGist(id, blob);
    } catch(e) { paper.hasPdf=false; }
    PAPERS.unshift(paper);
  }
  savePapers(PAPERS); window._PAPERS_REF=PAPERS; closeModal("addPaperModal");
  FolderManager.renderFolderTree(PAPERS); renderPaperList(); updateStats();
  selectPaper(PAPERS[0].id); showToast("✅ 已添加 "+files.length+" 篇"); debouncedPush("添加论文");
}

function deletePaper(id) {
  if(!confirm("确定删除这篇论文及所有笔记？")) return;
  // 记录删除，防止同步时复活
  var deleted = getDeletedIds();
  if (!deleted.includes(id)) { deleted.push(id); saveDeletedIds(deleted); }
  deletePdfBlob(id); deletePdfFromGist(id); PAPERS=PAPERS.filter(p=>p.id!==id); savePapers(PAPERS); window._PAPERS_REF=PAPERS;
  if(currentPaperId===id){currentPaperId=null;renderWelcome();}
  FolderManager.renderFolderTree(PAPERS); renderPaperList(); updateStats(); showToast("已删除"); debouncedPush("删除论文");
}

function deleteSection(paperId,idx) {
  const p=PAPERS.find(x=>x.id===paperId); if(!p||!p.sections) return;
  if(!confirm('删除"'+p.sections[idx].title+'"?')) return;
  p.sections.splice(idx,1); p.updatedAt=Date.now(); savePapers(PAPERS); renderPaperDetail(paperId); debouncedPush("删除笔记章节");
}
function moveSectionUp(paperId,idx) {
  var p=PAPERS.find(x=>x.id===paperId); if(!p||!p.sections||idx<=0) return;
  var tmp=p.sections[idx-1]; p.sections[idx-1]=p.sections[idx]; p.sections[idx]=tmp;
  p.updatedAt=Date.now(); savePapers(PAPERS); renderPaperDetail(paperId); debouncedPush("调整板块顺序");
}
function moveSectionDown(paperId,idx) {
  var p=PAPERS.find(x=>x.id===paperId); if(!p||!p.sections||idx>=p.sections.length-1) return;
  var tmp=p.sections[idx+1]; p.sections[idx+1]=p.sections[idx]; p.sections[idx]=tmp;
  p.updatedAt=Date.now(); savePapers(PAPERS); renderPaperDetail(paperId); debouncedPush("调整板块顺序");
}
function renameSectionInline(paperId, idx, el) {
  if (el.querySelector("input")) return;
  var p = PAPERS.find(x => x.id === paperId); if (!p||!p.sections) return;
  var oldTitle = p.sections[idx].title;
  var input = document.createElement("input");
  input.className = "inline-edit-input";
  input.value = oldTitle;
  input.style.fontSize = "12px"; input.style.fontWeight = "600";
  el.textContent = ""; el.appendChild(input); input.focus(); input.select();
  function save() {
    var v = input.value.trim();
    if (v && v !== oldTitle) { p.sections[idx].title = v; p.updatedAt = Date.now(); savePapers(PAPERS); debouncedPush("重命名板块"); }
    renderPaperDetail(paperId);
  }
  input.addEventListener("blur", save);
  input.addEventListener("keydown", function(e) { if(e.key==="Enter"){e.preventDefault();save();} if(e.key==="Escape") renderPaperDetail(paperId); });
}
function editSectionContent(paperId, idx, el) {
  if (el.querySelector("textarea")) return;
  var p = PAPERS.find(x => x.id === paperId); if (!p||!p.sections) return;
  var oldContent = p.sections[idx].content || "";
  var ta = document.createElement("textarea");
  ta.className = "inline-edit-input";
  ta.value = oldContent;
  ta.style.minHeight = "120px"; ta.style.resize = "vertical"; ta.style.lineHeight = "1.6"; ta.style.whiteSpace = "pre-wrap";
  el.textContent = ""; el.appendChild(ta); ta.focus();
  function save() {
    var v = ta.value.trim();
    if (v !== oldContent) { p.sections[idx].content = v; p.updatedAt = Date.now(); savePapers(PAPERS); debouncedPush("编辑板块内容"); }
    renderPaperDetail(paperId);
  }
  ta.addEventListener("blur", save);
  ta.addEventListener("keydown", function(e) { if(e.key==="Enter"&&e.ctrlKey){e.preventDefault();save();} if(e.key==="Escape") renderPaperDetail(paperId); });
}

// --- Extract DOI from paper ---
function extractDOI(p) {
  if (p.doi) {
    const m = p.doi.match(/10\.\d{4,}\/[^\s]+/);
    if (m) return m[0];
  }
  return null;
}

// --- Auto-fetch references via CrossRef API (free, no key) ---
async function autoFetchRefs(paperId) {
  const p = PAPERS.find(x => x.id === paperId); if (!p) return;
  const doi = extractDOI(p);

  const body = document.getElementById("refsBody");
  if (body) body.innerHTML = '<div class="ref-empty">⏳ 正在从 CrossRef 获取引用列表...</div>';

  try {
    let refs = [];
    // Method 1: CrossRef (via DOI)
    if (doi) {
      const cr = await fetch('https://api.crossref.org/works/' + encodeURIComponent(doi), {
        headers: { 'Accept': 'application/json' }
      });
      if (cr.ok) {
        const data = await cr.json();
        const crRefs = (data.message && data.message.reference) || [];
        refs = crRefs.map(r => ({
          title: r['article-title'] || r['volume-title'] || r.unstructured || '',
          authors: r.author || '',
          year: parseInt(r.year) || null,
          doi: r.DOI || null,
          url: r.DOI ? ('https://doi.org/' + r.DOI) : null
        })).filter(r => r.title && r.title.length > 5);
      }
    }

    // Method 2: Semantic Scholar (via DOI or title) if CrossRef didn't work
    if (!refs.length) {
      const paperId2 = doi ? ('DOI:' + doi) : null;
      if (paperId2) {
        const ss = await fetch('https://api.semanticscholar.org/graph/v1/paper/' + encodeURIComponent(paperId2) + '/references?fields=title,authors,year,externalIds,url&limit=100');
        if (ss.ok) {
          const data = await ss.json();
          refs = (data.data || []).map(r => r.citedPaper).filter(cp => cp && cp.title).map(cp => ({
            title: cp.title,
            authors: (cp.authors || []).map(a => a.name).join(', '),
            year: cp.year || null,
            doi: (cp.externalIds && cp.externalIds.DOI) || null,
            url: cp.url || (cp.externalIds && cp.externalIds.DOI ? 'https://doi.org/' + cp.externalIds.DOI : null)
          }));
        }
      }
    }

    if (!refs.length) {
      if (body) body.innerHTML = '<div class="ref-empty">未找到引用数据' + (doi ? '' : '<br><small>提示：添加 DOI 可提高获取成功率</small>') + '</div>';
      showToast('未找到引用数据，可尝试 🔍 手动搜索');
      return;
    }

    // Deduplicate by title similarity
    const seen = new Set();
    refs = refs.filter(r => {
      const key = r.title.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 40);
      if (seen.has(key)) return false;
      seen.add(key); return true;
    });

    // Save
    if (!p.references) p.references = [];
    // Merge: don't add duplicates
    let added = 0;
    refs.forEach(r => {
      const exists = p.references.some(er => er.title.toLowerCase().replace(/[^a-z0-9]/g,'').substring(0,30) === r.title.toLowerCase().replace(/[^a-z0-9]/g,'').substring(0,30));
      if (!exists) { p.references.push(r); added++; }
    });
    p.updatedAt = Date.now();
    savePapers(PAPERS); window._PAPERS_REF = PAPERS;
    renderPaperDetail(paperId);
    debouncedPush("获取引用文章");
    showToast('✅ 获取到 ' + refs.length + ' 篇引用文章' + (added < refs.length ? '（' + (refs.length - added) + ' 篇已存在）' : ''));
  } catch (e) {
    console.error('Fetch refs failed:', e);
    if (body) body.innerHTML = '<div class="ref-empty">❌ 获取失败: ' + esc(e.message) + '</div>';
    showToast('❌ 获取引用失败');
  }
}

// --- Auto-fetch citations via Semantic Scholar API (free, no key) ---
async function autoFetchCitations(paperId) {
  const p = PAPERS.find(x => x.id === paperId); if (!p) return;
  const doi = extractDOI(p);

  const body = document.getElementById("citesBody");
  if (body) body.innerHTML = '<div class="ref-empty">⏳ 正在从 Semantic Scholar 获取被引列表...</div>';

  try {
    let cites = [];
    // Try DOI first, then title search
    const lookupId = doi ? ('DOI:' + doi) : null;

    if (lookupId) {
      const ss = await fetch('https://api.semanticscholar.org/graph/v1/paper/' + encodeURIComponent(lookupId) + '/citations?fields=title,authors,year,externalIds,url&limit=100');
      if (ss.ok) {
        const data = await ss.json();
        cites = (data.data || []).map(c => c.citingPaper).filter(cp => cp && cp.title).map(cp => ({
          title: cp.title,
          authors: (cp.authors || []).map(a => a.name).join(', '),
          year: cp.year || null,
          doi: (cp.externalIds && cp.externalIds.DOI) || null,
          url: cp.url || (cp.externalIds && cp.externalIds.DOI ? 'https://doi.org/' + cp.externalIds.DOI : null)
        }));
      }
    }

    // Fallback: search by title
    if (!cites.length) {
      const searchUrl = 'https://api.semanticscholar.org/graph/v1/paper/search?query=' + encodeURIComponent(p.title) + '&limit=1&fields=citations';
      const sr = await fetch(searchUrl);
      if (sr.ok) {
        const sd = await sr.json();
        if (sd.data && sd.data[0] && sd.data[0].paperId) {
          const foundId = sd.data[0].paperId;
          const ss2 = await fetch('https://api.semanticscholar.org/graph/v1/paper/' + foundId + '/citations?fields=title,authors,year,externalIds,url&limit=100');
          if (ss2.ok) {
            const data2 = await ss2.json();
            cites = (data2.data || []).map(c => c.citingPaper).filter(cp => cp && cp.title).map(cp => ({
              title: cp.title,
              authors: (cp.authors || []).map(a => a.name).join(', '),
              year: cp.year || null,
              doi: (cp.externalIds && cp.externalIds.DOI) || null,
              url: cp.url || (cp.externalIds && cp.externalIds.DOI ? 'https://doi.org/' + cp.externalIds.DOI : null)
            }));
          }
        }
      }
    }

    if (!cites.length) {
      if (body) body.innerHTML = '<div class="ref-empty">未找到被引数据' + (doi ? '' : '<br><small>提示：添加 DOI 可提高获取成功率</small>') + '</div>';
      showToast('未找到被引数据');
      return;
    }

    // Deduplicate
    const seen = new Set();
    cites = cites.filter(c => {
      const key = c.title.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 40);
      if (seen.has(key)) return false;
      seen.add(key); return true;
    });

    // Save
    if (!p.citations) p.citations = [];
    let added = 0;
    cites.forEach(c => {
      const exists = p.citations.some(ec => ec.title.toLowerCase().replace(/[^a-z0-9]/g,'').substring(0,30) === c.title.toLowerCase().replace(/[^a-z0-9]/g,'').substring(0,30));
      if (!exists) { p.citations.push(c); added++; }
    });
    p.updatedAt = Date.now();
    savePapers(PAPERS); window._PAPERS_REF = PAPERS;
    renderPaperDetail(paperId);
    debouncedPush("获取被引文章");
    showToast('✅ 获取到 ' + cites.length + ' 篇被引文章' + (added < cites.length ? '（' + (cites.length - added) + ' 篇已存在）' : ''));
  } catch (e) {
    console.error('Fetch citations failed:', e);
    if (body) body.innerHTML = '<div class="ref-empty">❌ 获取失败: ' + esc(e.message) + '</div>';
    showToast('❌ 获取被引失败');
  }
}

// --- Manual add/remove ---
function removeRef(paperId, type, idx) {
  const p = PAPERS.find(x => x.id === paperId);
  if (!p || !p[type] || !p[type][idx]) return;
  if (!confirm('删除 "' + p[type][idx].title + '"?')) return;
  p[type].splice(idx, 1);
  p.updatedAt = Date.now();
  savePapers(PAPERS);
  renderPaperDetail(paperId);
  debouncedPush("删除引用/被引");
}

// ==================== PDF 迁移（旧方案 → 新方案）====================
// 自动检测旧方案的 PDF（存在主 Gist 里的 fsi_pdf_xxx.b64 文件），
// 从本地 IndexedDB 读出来，重新上传到独立 public Gist，然后清理旧文件。
async function migratePdfsToNewScheme() {
  if (!isGHConnected()) return;
  // 找出需要迁移的论文：有 hasPdf 但没有 pdfGistId
  var toMigrate = PAPERS.filter(function(p) { return p.hasPdf && !p.pdfGistId; });
  if (toMigrate.length === 0) return;

  console.log("[pdf-migrate] Found " + toMigrate.length + " papers to migrate");
  var migrated = 0;

  for (var i = 0; i < toMigrate.length; i++) {
    var paper = toMigrate[i];
    try {
      // 从本地 IndexedDB 读取 PDF blob
      var blob = await loadPdfBlob(paper.id);
      if (!blob) {
        console.log("[pdf-migrate] Skipping " + paper.id + " — no local blob (will migrate from another device)");
        continue;
      }

      console.log("[pdf-migrate] Migrating: " + paper.title + " (" + (blob.size/1024/1024).toFixed(1) + " MB)");

      // 上传到新的独立 public Gist
      var b64 = await _blobToBase64(blob);
      var gist = await ghAPI("https://api.github.com/gists", {
        method: "POST",
        body: JSON.stringify({
          description: "FSI PDF: " + paper.id,
          public: true,
          files: { "pdf.b64": { content: b64 } }
        })
      });

      paper.pdfGistId = gist.id;
      paper.updatedAt = Date.now();
      migrated++;
      console.log("[pdf-migrate] ✅ " + paper.title + " → gist " + gist.id);

      // 清理旧文件（静默）
      _cleanupOldPdfFile(paper.id);
    } catch(e) {
      console.warn("[pdf-migrate] Failed for " + paper.id + ":", e);
    }
  }

  if (migrated > 0) {
    savePapers(PAPERS);
    debouncedPush("PDF迁移");
    showToast("☁️ 已迁移 " + migrated + " 个 PDF 到新存储方案");
  }

  // 额外清理：检查主 Gist 里是否有残留的 fsi_pdf_*.b64 文件
  try {
    var gistId = getGHGistId();
    var mainGist = await ghAPI("https://api.github.com/gists/" + gistId);
    var filesToDelete = {};
    var hasOldFiles = false;
    for (var fname in mainGist.files) {
      if (fname.startsWith("fsi_pdf_") && fname.endsWith(".b64")) {
        filesToDelete[fname] = null;
        hasOldFiles = true;
      }
    }
    if (hasOldFiles) {
      console.log("[pdf-migrate] Cleaning up old PDF files from main Gist:", Object.keys(filesToDelete));
      await ghAPI("https://api.github.com/gists/" + gistId, {
        method: "PATCH",
        body: JSON.stringify({ files: filesToDelete })
      });
      console.log("[pdf-migrate] ✅ Main Gist cleaned");
    }
  } catch(e) { console.warn("[pdf-migrate] Cleanup failed:", e); }
}

  });

  renderPaperList();

  await initSync();

  setTimeout(migratePdfsToNewScheme, 3000);
})();
